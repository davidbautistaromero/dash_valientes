name: Data Pipeline

on:
  schedule:
    - cron: '0 2 * * 1'            # Todos los lunes, 2 AM UTC
  workflow_dispatch:                 # Ejecución manual desde GitHub

jobs:
  etl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Extraer y transformar datos (ETL)
        run: python scripts/etl.py

      - name: Confirmar y publicar datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "etl: actualizar datos [$(date '+%Y-%m-%d')]"
          git push

      - name: Sincronizar con Hugging Face Spaces
        run: |
          git push --force https://dbautista98:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/dbautista98/observatorio-escnna.git master:main
